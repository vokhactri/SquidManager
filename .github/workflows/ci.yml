name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - parallel:
          # The config test runs `squid -k parse` and skips itself without squid.
          - run: brew install squid
          - run: scripts/format.sh --lint
      - run: scripts/test.sh
      - run: scripts/build-app.sh
